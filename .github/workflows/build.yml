name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Set up Rust for Android
        run: |
          rustup target add aarch64-linux-android armv7-linux-androideabi
          echo "ANDROID_NDK_HOME=$ANDROID_NDK_LATEST_HOME" >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: native/voice
      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked
      - name: Build voice library (DAVE + Opus)
        working-directory: native/voice
        run: |
          export CMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake"
          export ANDROID_PLATFORM=android-30
          for abi in arm64-v8a armeabi-v7a; do
            ANDROID_ABI=$abi cargo ndk -t $abi -P 30 -o ../../app/build/rustJniLibs build --release
          done
          ls -la ../../app/build/rustJniLibs/*
      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest --stacktrace
      - name: Decode signing keystore (if configured)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release-key.jks"
            echo "KEYSTORE_PATH=$RUNNER_TEMP/release-key.jks" >> "$GITHUB_ENV"
          fi
      - name: Build APKs
        run: ./gradlew :app:assembleDebug :app:assembleRelease --stacktrace
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      - name: Report APK sizes
        run: |
          {
            echo "### APK sizes"
            for f in app/build/outputs/apk/release/*.apk app/build/outputs/apk/debug/*.apk; do
              echo "- \`$(basename "$f")\`: $(du -h "$f" | cut -f1)"
            done
            echo
            echo "<details><summary>Largest entries in the release APK</summary>"
            echo
            echo '```'
            unzip -lv app/build/outputs/apk/release/*.apk | sort -k1 -n -r | head -15
            echo '```'
            echo "</details>"
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: dihcord-release
          path: app/build/outputs/apk/release/*.apk
      - uses: actions/upload-artifact@v4
        with:
          name: dihcord-debug
          path: app/build/outputs/apk/debug/*.apk
