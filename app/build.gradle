plugins {
    alias(libs.plugins.android.application)
    alias(libs.plugins.kotlin.android)
    alias(libs.plugins.compose.compiler)
}

android {
    namespace "com.dihcord.app"
    compileSdk 35

    testOptions {
        // org.json / android.util are stubs in JVM tests; let untouched calls return defaults.
        unitTests.returnDefaultValues = true
    }

    lint { //stupid lint keeps crashing 3:<
        checkReleaseBuilds = false
        abortOnError = false
        disable "NullSafeMutableLiveData"
    }

    defaultConfig {
        applicationId "com.dihcord.app"
        minSdk 30
        targetSdk 35
        versionCode 10
        versionName "2.1"
    }

    packagingOptions {
        jniLibs {
            useLegacyPackaging = true
        }
    }

    buildFeatures {
        buildConfig true
        compose true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
        freeCompilerArgs += ["-opt-in=androidx.compose.foundation.layout.ExperimentalLayoutApi"]
    }
    // Release signing is only configured when a keystore is supplied (CI); local/debug builds need none.
    def keystorePath = System.getenv("KEYSTORE_PATH")
    signingConfigs {
        if (keystorePath != null && file(keystorePath).exists()) {
            release {
                storeFile file(keystorePath)
                storePassword System.getenv("KEYSTORE_PASSWORD")
                keyAlias System.getenv("KEY_ALIAS")
                keyPassword System.getenv("KEY_PASSWORD")
            }
        }
    }
    buildTypes {
        release {
            // Without a release keystore, sign with the debug key so the optimized (R8, non-debuggable)
            // build is still installable. Debug builds are several times slower in Compose.
            signingConfig signingConfigs.findByName("release") ?: signingConfigs.debug
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

dependencies {
    testImplementation libs.junit
    testImplementation libs.kotlinx.coroutines.test

    implementation libs.androidx.core.ktx
    implementation libs.androidx.activity.compose
    implementation libs.wear.compose.material3
    implementation libs.wear.compose.foundation
    implementation libs.wear.compose.navigation
    implementation libs.kotlinx.coroutines
    implementation libs.wear.input
    implementation libs.okhttp
    implementation libs.coil.compose
    implementation libs.coil.gif
    implementation libs.coil.svg
    implementation libs.compose.material3
    implementation libs.zxing.core
    implementation libs.wear.tiles
    implementation libs.wear.protolayout
    implementation libs.wear.complications.source
    implementation libs.concurrent.futures
}
