plugins {
    alias(libs.plugins.android.application)
    alias(libs.plugins.kotlin.android)
    alias(libs.plugins.compose.compiler)
}

android {
    namespace "com.watchrept.app"
    compileSdk 35

    lint { //stupid lint keeps crashing 3:<
        checkReleaseBuilds = false
        abortOnError = false
        disable "NullSafeMutableLiveData"
    }

    defaultConfig {
        applicationId "com.watchrept.app"
        minSdk 30
        targetSdk 35
        versionCode 10
        versionName "2.1"
    }

    packagingOptions {
        jniLibs {
            useLegacyPackaging = true
        }
    }

    buildFeatures {
        buildConfig true
        compose true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
        freeCompilerArgs += ["-opt-in=androidx.compose.foundation.layout.ExperimentalLayoutApi"]
    }
    // Release signing is only configured when a keystore is supplied (CI); local/debug builds need none.
    def keystorePath = System.getenv("KEYSTORE_PATH")
    signingConfigs {
        if (keystorePath != null && file(keystorePath).exists()) {
            release {
                storeFile file(keystorePath)
                storePassword System.getenv("KEYSTORE_PASSWORD")
                keyAlias System.getenv("KEY_ALIAS")
                keyPassword System.getenv("KEY_PASSWORD")
            }
        }
    }
    buildTypes {
        release {
            if (signingConfigs.findByName("release") != null) {
                signingConfig signingConfigs.release
            }
            minifyEnabled true
        }
    }
}

dependencies {
    implementation libs.androidx.core.ktx
    implementation libs.androidx.activity.compose
    implementation libs.wear.compose.material3
    implementation libs.wear.compose.foundation
    implementation libs.wear.compose.navigation
    implementation libs.kotlinx.coroutines
    implementation libs.wear.input
    implementation libs.okhttp
    implementation libs.coil.compose
    implementation libs.coil.gif
    implementation libs.coil.svg
    implementation libs.compose.material3
    implementation libs.zxing.core
}
